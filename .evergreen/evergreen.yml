stepback: false

exec_timeout_secs: 1800

functions:
  "fetch source":
    - command: git.get_project
      params:
        directory: src

  "install rust":
    - command: shell.exec
      params:
        working_dir: src
        shell: bash
        script: |
          set -Eeou pipefail
          system="$(uname -s)"
          if [[ "${OS:-}" == "Windows_NT" || "$system" == CYGWIN* || "$system" == MINGW* || "$system" == MSYS* ]]; then
            export CARGO_HOME="$(cygpath -w "$(pwd)/.cargo")"
            export RUSTUP_HOME="$(cygpath -w "$(pwd)/.rustup")"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable-x86_64-pc-windows-msvc --profile minimal --no-modify-path
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
          fi

  "build":
    - command: shell.exec
      params:
        working_dir: src
        shell: bash
        script: |
          set -Eeou pipefail
          system="$(uname -s)"
          if [[ "${OS:-}" == "Windows_NT" || "$system" == CYGWIN* || "$system" == MINGW* || "$system" == MSYS* ]]; then
            cargo_home="$(cygpath -u "$(pwd)/.cargo")"
            export CARGO_HOME="$(cygpath -w "$(pwd)/.cargo")"
            export RUSTUP_HOME="$(cygpath -w "$(pwd)/.rustup")"
            export PATH="$cargo_home/bin:$PATH"
          else
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          hash -r
          .evergreen/scripts/build.sh "${target}"

  "upload binary":
    - command: s3.put
      params:
        role_arn: ${release_bucket_role_arn}
        local_file: src/target/${target}/release/atlas-cli-plugin-sh${binary_ext}
        remote_file: ${project}/${version_id}/binaries/${target}/atlas-cli-plugin-sh${binary_ext}
        bucket: ${release_bucket}
        permissions: private
        content_type: application/octet-stream

  "authenticate to ecr":
    - command: ec2.assume_role
      params:
        role_arn: ${ecr_role_arn|arn:aws:iam::901841024863:role/ecr-role-evergreen-ro}
    - command: subprocess.exec
      params:
        working_dir: src
        include_expansions_in_env:
          - AWS_ACCESS_KEY_ID
          - AWS_SECRET_ACCESS_KEY
          - AWS_SESSION_TOKEN
        binary: .evergreen/scripts/ecr-login.sh

  "sign windows binary":
    - command: shell.exec
      params:
        working_dir: src
        shell: bash
        env:
          GRS_USERNAME: ${garasign_username}
          GRS_PASSWORD: ${garasign_password}
          AUTHENTICODE_KEY_NAME: ${authenticode_key_name}
        script: |
          set -Eeou pipefail
          .evergreen/scripts/sign-windows.sh "${binary}"

  "sign linux artifacts":
    - command: shell.exec
      params:
        working_dir: src
        shell: bash
        env:
          GRS_USERNAME: ${garasign_username}
          GRS_PASSWORD: ${garasign_password}
        script: |
          set -Eeou pipefail
          .evergreen/scripts/sign-linux.sh \
            artifacts/atlas-cli-plugin-sh-x86_64-unknown-linux-gnu.tar.gz \
            artifacts/atlas-cli-plugin-sh-aarch64-unknown-linux-gnu.tar.gz

  "download binary":
    - command: s3.get
      params:
        role_arn: ${release_bucket_role_arn}
        remote_file: ${project}/${version_id}/binaries/${target}/atlas-cli-plugin-sh${binary_ext}
        bucket: ${release_bucket}
        local_file: src/incoming-binaries/${target}/atlas-cli-plugin-sh${binary_ext}

  "install macos notarization service":
    - command: shell.exec
      params:
        working_dir: src
        shell: bash
        include_expansions_in_env:
          - macnotary_client_url
        script: |
          set -Eeou pipefail
          .evergreen/scripts/install-macnotary.sh "${macnotary_client_url}" "$(pwd)/.macnotary"

  "notarize macos binaries":
    - command: shell.exec
      params:
        working_dir: src
        shell: bash
        include_expansions_in_env:
          - notary_service_key_id
          - notary_service_secret
          - notary_service_url
        script: |
          set -Eeou pipefail
          export MACOS_NOTARY_KEY="${notary_service_key_id}"
          export MACOS_NOTARY_SECRET="${notary_service_secret}"
          .evergreen/scripts/notarize-macos.sh \
            "$(pwd)/.macnotary/linux_amd64/macnotary" \
            "${notary_service_url}" \
            "com.mongodb.atlas-cli-plugin-sh" \
            incoming-binaries/aarch64-apple-darwin/atlas-cli-plugin-sh \
            incoming-binaries/x86_64-apple-darwin/atlas-cli-plugin-sh

  "upload notarized binary":
    - command: s3.put
      params:
        role_arn: ${release_bucket_role_arn}
        local_file: src/incoming-binaries/${target}/atlas-cli-plugin-sh
        remote_file: ${project}/${version_id}/binaries-notarized/${target}/atlas-cli-plugin-sh
        bucket: ${release_bucket}
        permissions: private
        content_type: application/octet-stream

  "download notarized binary":
    - command: s3.get
      params:
        role_arn: ${release_bucket_role_arn}
        remote_file: ${project}/${version_id}/binaries-notarized/${target}/atlas-cli-plugin-sh
        bucket: ${release_bucket}
        local_file: src/incoming-binaries/${target}/atlas-cli-plugin-sh

  "package one target":
    - command: shell.exec
      params:
        working_dir: src
        shell: bash
        script: |
          set -Eeou pipefail
          .evergreen/scripts/package.sh "${target}" "incoming-binaries/${target}/atlas-cli-plugin-sh${binary_ext}" "$(pwd)/artifacts"

  "create github release":
    - command: github.generate_token
      params:
        expansion_name: github_token
    - command: shell.exec
      params:
        working_dir: src
        shell: bash
        env:
          GH_TOKEN: ${github_token}
        script: |
          set -Eeou pipefail
          .evergreen/scripts/release.sh "${triggered_by_git_tag}" "$(pwd)/artifacts"

tasks:
  - name: build_macos
    commands:
      - func: "fetch source"
      - func: "install rust"
      - func: "build"
        vars:
          target: "aarch64-apple-darwin"
      - func: "upload binary"
        vars:
          target: "aarch64-apple-darwin"
          binary_ext: ""
      - func: "build"
        vars:
          target: "x86_64-apple-darwin"
      - func: "upload binary"
        vars:
          target: "x86_64-apple-darwin"
          binary_ext: ""

  - name: build_linux_x86_64
    commands:
      - func: "fetch source"
      - func: "install rust"
      - func: "build"
        vars:
          target: "x86_64-unknown-linux-gnu"
      - func: "upload binary"
        vars:
          target: "x86_64-unknown-linux-gnu"
          binary_ext: ""

  - name: build_linux_arm64
    commands:
      - func: "fetch source"
      - func: "install rust"
      - func: "build"
        vars:
          target: "aarch64-unknown-linux-gnu"
      - func: "upload binary"
        vars:
          target: "aarch64-unknown-linux-gnu"
          binary_ext: ""

  - name: build_windows
    commands:
      - func: "fetch source"
      - func: "install rust"
      - func: "build"
        vars:
          target: "x86_64-pc-windows-msvc"
      - func: "upload binary"
        vars:
          target: "x86_64-pc-windows-msvc"
          binary_ext: ".exe"

  - name: notarize_macos
    depends_on:
      - name: build_macos
        variant: macos
    commands:
      - func: "fetch source"
      - func: "download binary"
        vars:
          target: "aarch64-apple-darwin"
          binary_ext: ""
      - func: "download binary"
        vars:
          target: "x86_64-apple-darwin"
          binary_ext: ""
      - func: "install macos notarization service"
      - func: "notarize macos binaries"
      - func: "upload notarized binary"
        vars:
          target: "aarch64-apple-darwin"
      - func: "upload notarized binary"
        vars:
          target: "x86_64-apple-darwin"

  - name: package
    depends_on:
      - name: notarize_macos
        variant: notarize-and-release
      - name: build_linux_x86_64
        variant: linux-x86_64
      - name: build_linux_arm64
        variant: linux-arm64
      - name: build_windows
        variant: windows
    commands:
      - func: "fetch source"
      - func: "download notarized binary"
        vars:
          target: "aarch64-apple-darwin"
      - func: "download notarized binary"
        vars:
          target: "x86_64-apple-darwin"
      - func: "download binary"
        vars:
          target: "x86_64-unknown-linux-gnu"
          binary_ext: ""
      - func: "download binary"
        vars:
          target: "aarch64-unknown-linux-gnu"
          binary_ext: ""
      - func: "download binary"
        vars:
          target: "x86_64-pc-windows-msvc"
          binary_ext: ".exe"
      - func: "authenticate to ecr"
      - func: "package one target"
        vars:
          target: "aarch64-apple-darwin"
          binary_ext: ""
      - func: "package one target"
        vars:
          target: "x86_64-apple-darwin"
          binary_ext: ""
      - func: "package one target"
        vars:
          target: "x86_64-unknown-linux-gnu"
          binary_ext: ""
      - func: "package one target"
        vars:
          target: "aarch64-unknown-linux-gnu"
          binary_ext: ""
      - func: "sign linux artifacts"
      - func: "sign windows binary"
        vars:
          binary: "incoming-binaries/x86_64-pc-windows-msvc/atlas-cli-plugin-sh.exe"
      - func: "package one target"
        vars:
          target: "x86_64-pc-windows-msvc"
          binary_ext: ".exe"
      - command: s3.put
        params:
          role_arn: ${release_bucket_role_arn}
          local_file: src/artifacts/atlas-cli-plugin-sh-aarch64-apple-darwin.tar.gz
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-aarch64-apple-darwin.tar.gz
          bucket: ${release_bucket}
          permissions: private
          content_type: application/octet-stream
      - command: s3.put
        params:
          role_arn: ${release_bucket_role_arn}
          local_file: src/artifacts/atlas-cli-plugin-sh-x86_64-apple-darwin.tar.gz
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-x86_64-apple-darwin.tar.gz
          bucket: ${release_bucket}
          permissions: private
          content_type: application/octet-stream
      - command: s3.put
        params:
          role_arn: ${release_bucket_role_arn}
          local_file: src/artifacts/atlas-cli-plugin-sh-x86_64-unknown-linux-gnu.tar.gz
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-x86_64-unknown-linux-gnu.tar.gz
          bucket: ${release_bucket}
          permissions: private
          content_type: application/octet-stream
      - command: s3.put
        params:
          role_arn: ${release_bucket_role_arn}
          local_file: src/artifacts/atlas-cli-plugin-sh-aarch64-unknown-linux-gnu.tar.gz
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-aarch64-unknown-linux-gnu.tar.gz
          bucket: ${release_bucket}
          permissions: private
          content_type: application/octet-stream
      - command: s3.put
        params:
          role_arn: ${release_bucket_role_arn}
          local_file: src/artifacts/atlas-cli-plugin-sh-x86_64-pc-windows-msvc.zip
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-x86_64-pc-windows-msvc.zip
          bucket: ${release_bucket}
          permissions: private
          content_type: application/octet-stream
      - command: s3.put
        params:
          role_arn: ${release_bucket_role_arn}
          local_file: src/artifacts/checksums.sha256
          remote_file: ${project}/${version_id}/artifacts/checksums.sha256
          bucket: ${release_bucket}
          permissions: private
          content_type: text/plain
      - command: s3.put
        params:
          role_arn: ${release_bucket_role_arn}
          local_file: src/artifacts/atlas-cli-plugin-sh-x86_64-unknown-linux-gnu.tar.gz.sig
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-x86_64-unknown-linux-gnu.tar.gz.sig
          bucket: ${release_bucket}
          permissions: private
          content_type: application/pgp-signature
      - command: s3.put
        params:
          role_arn: ${release_bucket_role_arn}
          local_file: src/artifacts/atlas-cli-plugin-sh-aarch64-unknown-linux-gnu.tar.gz.sig
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-aarch64-unknown-linux-gnu.tar.gz.sig
          bucket: ${release_bucket}
          permissions: private
          content_type: application/pgp-signature

  - name: release
    git_tag_only: true
    depends_on:
      - name: package
        variant: notarize-and-release
    commands:
      - func: "fetch source"
      - command: s3.get
        params:
          role_arn: ${release_bucket_role_arn}
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-aarch64-apple-darwin.tar.gz
          bucket: ${release_bucket}
          local_file: src/artifacts/atlas-cli-plugin-sh-aarch64-apple-darwin.tar.gz
      - command: s3.get
        params:
          role_arn: ${release_bucket_role_arn}
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-x86_64-apple-darwin.tar.gz
          bucket: ${release_bucket}
          local_file: src/artifacts/atlas-cli-plugin-sh-x86_64-apple-darwin.tar.gz
      - command: s3.get
        params:
          role_arn: ${release_bucket_role_arn}
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-x86_64-unknown-linux-gnu.tar.gz
          bucket: ${release_bucket}
          local_file: src/artifacts/atlas-cli-plugin-sh-x86_64-unknown-linux-gnu.tar.gz
      - command: s3.get
        params:
          role_arn: ${release_bucket_role_arn}
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-aarch64-unknown-linux-gnu.tar.gz
          bucket: ${release_bucket}
          local_file: src/artifacts/atlas-cli-plugin-sh-aarch64-unknown-linux-gnu.tar.gz
      - command: s3.get
        params:
          role_arn: ${release_bucket_role_arn}
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-x86_64-pc-windows-msvc.zip
          bucket: ${release_bucket}
          local_file: src/artifacts/atlas-cli-plugin-sh-x86_64-pc-windows-msvc.zip
      - command: s3.get
        params:
          role_arn: ${release_bucket_role_arn}
          remote_file: ${project}/${version_id}/artifacts/checksums.sha256
          bucket: ${release_bucket}
          local_file: src/artifacts/checksums.sha256
      - command: s3.get
        params:
          role_arn: ${release_bucket_role_arn}
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-x86_64-unknown-linux-gnu.tar.gz.sig
          bucket: ${release_bucket}
          local_file: src/artifacts/atlas-cli-plugin-sh-x86_64-unknown-linux-gnu.tar.gz.sig
      - command: s3.get
        params:
          role_arn: ${release_bucket_role_arn}
          remote_file: ${project}/${version_id}/artifacts/atlas-cli-plugin-sh-aarch64-unknown-linux-gnu.tar.gz.sig
          bucket: ${release_bucket}
          local_file: src/artifacts/atlas-cli-plugin-sh-aarch64-unknown-linux-gnu.tar.gz.sig
      - func: "create github release"

buildvariants:
  - name: macos
    display_name: macOS (build)
    run_on:
      - macos-14-arm64
    tasks:
      - name: build_macos

  - name: linux-x86_64
    display_name: Linux x86_64 (build)
    run_on:
      - ubuntu2204-small
    tasks:
      - name: build_linux_x86_64

  - name: linux-arm64
    display_name: Linux arm64 (build)
    run_on:
      - ubuntu2204-arm64-small
    tasks:
      - name: build_linux_arm64

  - name: windows
    display_name: Windows (build)
    run_on:
      - windows-vsCurrent-small
    tasks:
      - name: build_windows

  - name: notarize-and-release
    display_name: Notarize & Release
    run_on:
      - ubuntu2204-small
    tasks:
      - name: notarize_macos
      - name: package
      - name: release
